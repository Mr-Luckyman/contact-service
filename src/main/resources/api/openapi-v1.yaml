openapi: 3.1.0
info:
  title: Contact Service API
  description: Управление контактами, компаниями и приглашениями
  version: 1.0.1
servers:
  - url: http://localhost:8081

paths:
  /api/v1/persons:
    post:
      tags: [persons]
      summary: Создание Person
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          description: Ошибка валидации
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Email уже существует
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      tags: [ persons ]
      summary: Список Persons с фильтром по email и пагинацией
      operationId: listPersons
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: Точное совпадение email
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page<PersonResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPageResponse'
        '400':
          description: size > 100
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/persons/{id}:
    get:
      tags: [ persons ]
      summary: Получение Person по ID
      operationId: getPerson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Person найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '404':
          description: Person не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [ persons ]
      summary: Обновление Person
      operationId: updatePerson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Person обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '400':
          description: Ошибка валидации
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Person не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Новый email уже занят
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [ persons ]
      summary: Удаление Person
      operationId: deletePerson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Person удалён
        '404':
          description: Person не найден
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/companies:
    post:
      summary: Создание новой компании
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        '201':
          description: Компания успешно создана
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      summary: Получение списка компаний
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyResponse"
        '400':
          $ref: "#/components/responses/BadRequest"

  /api/v1/companies/{id}:
    get:
      summary: Получение компании по ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        '200':
          description: Компания найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        '404':
          $ref: "#/components/responses/NotFound"
    put:
      summary: Обновление имени компании
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        '200':
          description: Компания обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Удаление компании
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        '204':
          description: Компания удалена
        '404':
          $ref: "#/components/responses/NotFound"

  /api/v1/invites:
    post:
      summary: Создание приглашения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        '201':
          description: Приглашение создано
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"

  /api/v1/invites/{referralCode}:
    get:
      summary: Проверка приглашения по коду
      parameters:
        - $ref: "#/components/parameters/ReferralCode"
      responses:
        '200':
          description: Приглашение найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        '404':
          $ref: "#/components/responses/NotFound"
        '410':
          $ref: "#/components/responses/Gone"

  /api/v1/invites/{referralCode}/accept:
    post:
      summary: Принятие приглашения
      parameters:
        - $ref: "#/components/parameters/ReferralCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        '200':
          description: Приглашение принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReferralCode:
      name: referralCode
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 8
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Конфликт состояния
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Gone:
      description: Ресурс больше недоступен
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    CreatePersonRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          example: "Иван Петров"
        email:
          type: string
          format: email
          maxLength: 255
          example: "ivan@example.com"
        phone:
          type: string
          maxLength: 50
          nullable: true
          example: "+79091234567"

    UpdatePersonRequest:
      type: object
      required:
        - fullName
        - email
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          example: "Иван Петров"
        email:
          type: string
          format: email
          maxLength: 255
          example: "ivan@example.com"
        phone:
          type: string
          maxLength: 50
          nullable: true
          example: "+79091234567"

    PersonResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
          example: "ivan@example.com"
        phone:
          type: string
          nullable: true
          example: "+79091234567"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-05-05T13:30:00Z"

    PersonPageResponse:
      type: object
      description: 'Page<PersonResponse>: items + page + size + total.'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonResponse'
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Acme Inc"
        persons:
          type: array
          items:
            $ref: "#/components/schemas/CreateCompanyPersonLinkRequest"
          default: []

    UpdateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Acme Ltd"

    CreateCompanyPersonLinkRequest:
      type: object
      required: [personId, role]
      properties:
        personId:
          type: string
          format: uuid
        role:
          type: string
          minLength: 1
          maxLength: 255
          example: "CEO"

    CompanyResponse:
      type: object
      required: [id, name, createdAt, updatedAt, persons]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        persons:
          type: array
          items:
            $ref: "#/components/schemas/CompanyPersonResponse"

    CompanyPersonResponse:
      type: object
      required: [personId, role]
      properties:
        personId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string

    CreateInviteRequest:
      type: object
      required: [email, companyId, role]
      properties:
        email:
          type: string
          format: email
        companyId:
          type: string
          format: uuid
        role:
          type: string
          minLength: 1
          maxLength: 255
        inviterPersonId:
          type: string
          format: uuid

    AcceptInviteRequest:
      type: object
      required: [email, fullName]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 1
          maxLength: 255

    InviteResponse:
      type: object
      required: [id, email, companyId, role, referralCode, status, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        companyId:
          type: string
          format: uuid
        role:
          type: string
        inviterPersonId:
          type: string
          format: uuid
        referralCode:
          type: string
          minLength: 8
          maxLength: 8
        status:
          $ref: "#/components/schemas/InviteStatus"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InviteStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, CANCELLED]

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        service:
          type: string
        errorCode:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
