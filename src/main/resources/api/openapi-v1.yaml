openapi: 3.1.0
info:
  title: Contact Service API
  description: Управление контактами, компаниями и приглашениями
  version: 1.0.1
servers:
  - url: http://localhost:8081

paths:
  /api/v1/persons:
    post:
      summary: Создание новой персоны
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        '201':
          description: Персона успешно создана
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '409':
          $ref: "#/components/responses/Conflict"
    get:
      summary: Получение списка персон
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        '200':
          description: Список персон
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonResponse"
        '400':
          $ref: "#/components/responses/BadRequest"

  /api/v1/persons/{id}:
    get:
      summary: Получение персоны по ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        '200':
          description: Персона найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        '404':
          $ref: "#/components/responses/NotFound"
    put:
      summary: Обновление персоны
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequest"
      responses:
        '200':
          description: Персона обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Удаление персоны
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        '204':
          description: Персона удалена
        '404':
          $ref: "#/components/responses/NotFound"

  /api/v1/companies:
    post:
      summary: Создание новой компании
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        '201':
          description: Компания успешно создана
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
    get:
      summary: Получение списка компаний
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyResponse"
        '400':
          $ref: "#/components/responses/BadRequest"

  /api/v1/companies/{id}:
    get:
      summary: Получение компании по ID
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        '200':
          description: Компания найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        '404':
          $ref: "#/components/responses/NotFound"
    put:
      summary: Обновление имени компании
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        '200':
          description: Компания обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Удаление компании
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        '204':
          description: Компания удалена
        '404':
          $ref: "#/components/responses/NotFound"

  /api/v1/invites:
    post:
      summary: Создание приглашения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        '201':
          description: Приглашение создано
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"

  /api/v1/invites/{referralCode}:
    get:
      summary: Проверка приглашения по коду
      parameters:
        - $ref: "#/components/parameters/ReferralCode"
      responses:
        '200':
          description: Приглашение найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        '404':
          $ref: "#/components/responses/NotFound"
        '410':
          $ref: "#/components/responses/Gone"

  /api/v1/invites/{referralCode}/accept:
    post:
      summary: Принятие приглашения
      parameters:
        - $ref: "#/components/parameters/ReferralCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        '200':
          description: Приглашение принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReferralCode:
      name: referralCode
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 8
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Конфликт состояния
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Gone:
      description: Ресурс больше недоступен
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    CreatePersonRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          example: "Иван Петров"
        email:
          type: string
          format: email
          maxLength: 255
          example: "ivan@example.com"

    UpdatePersonRequest:
      allOf:
        - $ref: "#/components/schemas/CreatePersonRequest"

    PersonResponse:
      type: object
      required: [id, fullName, email, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Acme Inc"
        persons:
          type: array
          items:
            $ref: "#/components/schemas/CreateCompanyPersonLinkRequest"
          default: []

    UpdateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Acme Ltd"

    CreateCompanyPersonLinkRequest:
      type: object
      required: [personId, role]
      properties:
        personId:
          type: string
          format: uuid
        role:
          type: string
          minLength: 1
          maxLength: 255
          example: "CEO"

    CompanyResponse:
      type: object
      required: [id, name, createdAt, updatedAt, persons]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        persons:
          type: array
          items:
            $ref: "#/components/schemas/CompanyPersonResponse"

    CompanyPersonResponse:
      type: object
      required: [personId, role]
      properties:
        personId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string

    CreateInviteRequest:
      type: object
      required: [email, companyId, role]
      properties:
        email:
          type: string
          format: email
        companyId:
          type: string
          format: uuid
        role:
          type: string
          minLength: 1
          maxLength: 255
        inviterPersonId:
          type: string
          format: uuid

    AcceptInviteRequest:
      type: object
      required: [email, fullName]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 1
          maxLength: 255

    InviteResponse:
      type: object
      required: [id, email, companyId, role, referralCode, status, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        companyId:
          type: string
          format: uuid
        role:
          type: string
        inviterPersonId:
          type: string
          format: uuid
        referralCode:
          type: string
          minLength: 8
          maxLength: 8
        status:
          $ref: "#/components/schemas/InviteStatus"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InviteStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, CANCELLED]

    ProblemDetail:
      type: object
      required: [type, title, status, errorCode]
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Validation failed"
        instance:
          type: string
          format: uri
          example: "/api/v1/persons"
        errorCode:
          type: string
          enum:
            - VALIDATION_FAILED
            - PERSON_EMAIL_CONFLICT
            - PERSON_NOT_FOUND
            - COMPANY_NOT_FOUND
            - INVITE_NOT_FOUND
            - INVITE_EXPIRED
            - INVITE_CONFLICT
