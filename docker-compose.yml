version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: contact-postgres
    environment:
      POSTGRES_DB: contact_db
      POSTGRES_USER: contact_user
      POSTGRES_PASSWORD: contact_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_user -d contact_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: